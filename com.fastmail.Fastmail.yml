id: com.fastmail.Fastmail
base: org.electronjs.Electron2.BaseApp
base-version: &base-version '25.08'
runtime: org.freedesktop.Platform
runtime-version: *base-version
sdk: org.freedesktop.Sdk
command: fastmail
separate-locales: false
finish-args:
  # Improves X11 performance via shared memory ext.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration
  - --device=dri
  # File upload/download for attachments/storage
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-public-share
  - --filesystem=xdg-videos
  # Viewing video/audio files
  - --socket=pulseaudio
  # Network access
  - --share=network
  # Printing (emails, notes etc.)
  - --socket=cups
  # Network printer discovery
  - --system-talk-name=org.freedesktop.Avahi
  # Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # This is needed for the notification count badge in DEs that implement
  # the Untiy protocol for this functionality (e.g. KDE)
  - --talk-name=com.canonical.Unity
  # Use same mouse cursors as host
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: fastmail
    buildsystem: simple
    build-commands:
      - chmod +x ./fastmail.AppImage
      - ./fastmail.AppImage --appimage-extract
      - desktop-file-edit --set-key=Icon --set-value=$FLATPAK_ID squashfs-root/fastmail.desktop
      - desktop-file-edit --set-key=Exec --set-value="fastmail %U" --set-icon=$FLATPAK_ID
        squashfs-root/fastmail.desktop
      - desktop-file-edit --set-key=Name --set-value=Fastmail squashfs-root/fastmail.desktop
      - install -D squashfs-root/fastmail.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm0644 "squashfs-root/usr/share/icons/hicolor/${size}x${size}/apps/fastmail.png" "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm0755 fastmail.sh "${FLATPAK_DEST}/bin/fastmail"
      - install -Dm0644 "squashfs-root/usr/share/metainfo/${FLATPAK_ID}.metainfo.xml"
        "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - mv squashfs-root "${FLATPAK_DEST}/fastmail"
    sources:
      - type: file
        dest-filename: fastmail.AppImage
        url: https://dl.fastmailcdn.com/desktop/production/linux/x64/com.fastmail.Fastmail-1.7.1.AppImage
        sha512: 6122f4cf57935215defee5909fe819bc7eeab472c2d93330b44643bae91b748c386b37d8f5133cafedeb03366a87ca50d722b061ad4886fb446ca629ddcf8876
        only-arches:
          - x86_64
        x-checker-data:
          type: electron-updater
          url: https://dl.fastmailcdn.com/desktop/production/linux/x64/latest-linux.yml
      - type: file
        dest-filename: fastmail.AppImage
        url: https://dl.fastmailcdn.com/desktop/production/linux/arm64/com.fastmail.Fastmail-1.7.1-arm64.AppImage
        sha512: fc41545253a65512aa4ad4efd8cad8a3d1e6c7c85e776d7f8022137348f48200433c71ff4fd622443600741b3a4a35596fe088111ce47a7d03939170739d9b14
        only-arches:
          - aarch64
        x-checker-data:
          type: electron-updater
          url: https://dl.fastmailcdn.com/desktop/production/linux/arm64/latest-linux-arm64.yml
      - type: file
        path: fastmail.sh
        dest-filename: fastmail.sh
