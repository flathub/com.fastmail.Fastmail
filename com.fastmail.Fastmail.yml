id: com.fastmail.Fastmail
base: org.electronjs.Electron2.BaseApp
base-version: &base-version '25.08'
runtime: org.freedesktop.Platform
runtime-version: *base-version
sdk: org.freedesktop.Sdk
command: fastmail
separate-locales: false
finish-args:
  # Improves X11 performance via shared memory ext.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration
  - --device=dri
  # File upload/download for attachments/storage
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-public-share
  - --filesystem=xdg-videos
  # Viewing video/audio files
  - --socket=pulseaudio
  # Network access
  - --share=network
  # Printing (emails, notes etc.)
  - --socket=cups
  # Network printer discovery
  - --system-talk-name=org.freedesktop.Avahi
  # Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # This is needed for the notification count badge in DEs that implement
  # the Untiy protocol for this functionality (e.g. KDE)
  - --talk-name=com.canonical.Unity
  # Use same mouse cursors as host
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: fastmail
    buildsystem: simple
    build-commands:
      - chmod +x ./fastmail.AppImage
      - ./fastmail.AppImage --appimage-extract
      - desktop-file-edit --set-key=Icon --set-value=$FLATPAK_ID squashfs-root/fastmail-beta.desktop
      - desktop-file-edit --set-key=Exec --set-value="fastmail %U" --set-icon=$FLATPAK_ID squashfs-root/fastmail-beta.desktop
      - desktop-file-edit --set-key=Name --set-value="Fastmail Beta" squashfs-root/fastmail-beta.desktop
      - install -D squashfs-root/fastmail-beta.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm0644 "squashfs-root/usr/share/icons/hicolor/${size}x${size}/apps/fastmail-beta.png" "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm0755 fastmail.sh "${FLATPAK_DEST}/bin/fastmail"
      - install -Dm0644 "squashfs-root/usr/share/metainfo/${FLATPAK_ID}.beta.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - sed -i 's|com\.fastmail\.Fastmail\.beta|com.fastmail.Fastmail|g' "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - mv squashfs-root/fastmail-beta squashfs-root/fastmail
      - mv squashfs-root "${FLATPAK_DEST}/fastmail"
    sources:
      - type: file
        dest-filename: fastmail.AppImage
        url: https://dl.fastmailcdn.com/desktop/beta/linux/x64/com.fastmail.Fastmail.beta-1.8.0-beta.0.AppImage
        sha512: b99db82a1cedabc797f8a09f4656d860b1182e803c819fdcdb2f5ce948a2a9b0b173848503b76a21b3790cd1b9a32bfd8c4ca56adf8291938f438ebca53ef74e
        only-arches:
          - x86_64
        x-checker-data:
          type: electron-updater
          url: https://dl.fastmailcdn.com/desktop/beta/linux/x64/beta-linux.yml
      - type: file
        dest-filename: fastmail.AppImage
        url: https://dl.fastmailcdn.com/desktop/beta/linux/arm64/com.fastmail.Fastmail.beta-1.8.0-beta.0-arm64.AppImage
        sha512: 0870901bd35ed43c4a27a67a657cac516dc68f817ec9702b9a6f8f7d7c7d729fc8aa224d8f4cfb202cc2e5c9218825d608f23c87b4f133b2a299c10df4213797
        only-arches:
          - aarch64
        x-checker-data:
          type: electron-updater
          url: https://dl.fastmailcdn.com/desktop/beta/linux/arm64/beta-linux-arm64.yml
      - type: file
        path: fastmail.sh
        dest-filename: fastmail.sh
